<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Driver Dispatch Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased pb-12">
    <div class="max-w-md md:max-w-4xl mx-auto p-4 md:p-6">
        <!-- Header -->
        <header class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-xl md:text-2xl font-extrabold text-sky-400">Driver Dispatch</h1>
                <p class="text-xs text-slate-400">Mobile Command Center</p>
            </div>
            <div class="flex gap-2">
                <a href="/" class="bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg text-xs font-bold transition">Store</a>
                <button onclick="loadDispatchQueue()" class="bg-sky-600 hover:bg-sky-500 px-3 py-2 rounded-lg text-xs font-bold transition">↻</button>
            </div>
        </header>

        <!-- Driver Ledger Stats Bar -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6 bg-slate-900 border border-slate-800 p-3 rounded-2xl text-center shadow-md">
            <div>
                <p class="text-[10px] text-slate-400 uppercase font-bold">Runs</p>
                <p id="stat-deliveries" class="text-lg font-extrabold text-white">0</p>
            </div>
            <div>
                <p class="text-[10px] text-slate-400 uppercase font-bold">Earnings</p>
                <p id="stat-earnings" class="text-lg font-extrabold text-emerald-400">$0.00</p>
            </div>
            <div>
                <p class="text-[10px] text-slate-400 uppercase font-bold">Miles</p>
                <p id="stat-miles" class="text-lg font-extrabold text-sky-400">0.0</p>
            </div>
            <div>
                <p class="text-[10px] text-slate-400 uppercase font-bold">Status</p>
                <p class="text-lg font-extrabold text-emerald-400">ONLINE</p>
            </div>
        </div>

        <!-- Active Orders Queue -->
        <h2 class="text-base md:text-lg font-bold text-white mb-3">Active Dispatch Nodes</h2>
        <div id="orders-container" class="space-y-3">
            <p class="text-slate-500 text-center py-12 text-sm">Scanning queue for active runs...</p>
        </div>
    </div>

    <script>
        async function loadDispatchQueue() {
            try {
                const [ordersRes, ledgerRes] = await Promise.all([
                    fetch('/api/orders'),
                    fetch('/api/driver-ledger')
                ]);
                const orders = await ordersRes.json();
                const ledger = await ledgerRes.json();

                document.getElementById('stat-deliveries').innerText = ledger.total_deliveries || 0;
                document.getElementById('stat-earnings').innerText = `$${(ledger.gross_earnings || 0).toFixed(2)}`;
                document.getElementById('stat-miles').innerText = ledger.total_miles || 0.0;

                let html = '';
                if (!orders || orders.length === 0) {
                    html = `<div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl text-center text-slate-500 text-sm">No pending orders. Standing by.</div>`;
                } else {
                    orders.forEach(order => {
                        const isAccepted = order.status === 'accepted';
                        const addressQuery = encodeURIComponent(order.delivery_address || 'Local Sector');

                        html += `
                            <div class="bg-slate-900 border ${isAccepted ? 'border-emerald-600/50' : 'border-sky-600/50'} p-4 rounded-2xl shadow-lg flex flex-col gap-3">
                                <div>
                                    <div class="flex justify-between items-center mb-1">
                                        <span class="bg-slate-800 text-sky-400 text-[10px] px-2 py-0.5 rounded uppercase font-bold">${order.merchant || 'Merchant'}</span>
                                        <span class="${isAccepted ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-amber-950 text-amber-400 border border-amber-800'} text-[10px] px-2 py-0.5 rounded uppercase font-bold">${order.status || 'pending'}</span>
                                    </div>
                                    <h3 class="font-bold text-base text-white">${order.items || 'Standard Delivery'}</h3>
                                    <p class="text-xs text-slate-400 mt-1">📍 Drop-off: ${order.delivery_address || 'N/A'}</p>
                                    <p class="text-sm font-extrabold text-emerald-400 mt-1">Payout: $${parseFloat(order.total || 0).toFixed(2)}</p>
                                </div>

                                <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-800">
                                    <a href="tel:555-0199" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 py-2.5 rounded-xl text-xs font-bold text-center transition shadow">📞 Call</a>
                                    <a href="sms:555-0199" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 py-2.5 rounded-xl text-xs font-bold text-center transition shadow">💬 Text</a>
                                    <a href="https://www.google.com/maps/search/?api=1&query=${addressQuery}" target="_blank" class="col-span-2 bg-sky-950 hover:bg-sky-900 active:scale-95 text-sky-300 border border-sky-800 py-2.5 rounded-xl text-xs font-bold text-center transition shadow">🗺️ Open GPS Navigation</a>

                                    ${!isAccepted ? `
                                        <button onclick="acceptOrder('${order.id}')" class="col-span-2 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white py-3 rounded-xl text-xs font-bold transition shadow">Accept & Sync Calendar</button>
                                    ` : `
                                        <button onclick="clearOrder('${order.id}')" class="col-span-2 bg-rose-900 hover:bg-rose-800 active:scale-95 text-rose-200 py-3 rounded-xl text-xs font-bold transition shadow">Complete / Clear Run</button>
                                    `}
                                </div>
                            </div>
                        `;
                    });
                }
                document.getElementById('orders-container').innerHTML = html;
            } catch (e) {
                console.error("Queue load error:", e);
            }
        }

        async function acceptOrder(orderId) {
            try {
                const res = await fetch(`/api/orders/${orderId}/accept`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ driver_email: "primary" })
                });
                const result = await res.json();
                alert(result.message);
                loadDispatchQueue();
            } catch (err) {
                alert("Error accepting order.");
            }
        }

        async function clearOrder(orderId) {
            try {
                await fetch(`/api/orders/${orderId}`, { method: 'DELETE' });
                loadDispatchQueue();
            } catch (err) {
                alert("Error clearing order.");
            }
        }

        window.onload = loadDispatchQueue;
    </script>
</body>
</html>
