<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Dispatch Command Center</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #fff; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; }

        .order-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .order-info h3 { margin: 0 0 5px 0; color: #4CAF50; }
        .order-info p { margin: 3px 0; font-size: 0.9rem; color: #aaa; }

        .right-section {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }
        .badge {
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            background: #ff9800;
            color: #000;
        }
        .btn-delete {
            background: #c62828;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-delete:hover { background: #b71c1c; }

        .btn-home {
            display: inline-block;
            margin-bottom: 20px;
            color: #4CAF50;
            text-decoration: none;
            font-weight: bold;
        }
        .btn-home:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <a href="/" class="btn-home">← Back to Storefront</a>
    <h1>Active Dispatch Dashboard</h1>
    <div class="subtitle">Live Delivery Queue & Driver Payouts</div>

    <div id="orders-container">
        <p style="text-align:center; color:#888;">Loading active dispatches...</p>
    </div>
</div>

<script>
    async function deleteOrder(paymentIntentId) {
        if (!confirm("Are you sure you want to remove this order from the dispatch queue?")) return;

        try {
            const response = await fetch(`/api/orders/${paymentIntentId}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                fetchOrders();
            } else {
                alert("Failed to delete order from server.");
            }
        } catch (err) {
            console.error("Error deleting order:", err);
        }
    }

    async function fetchOrders() {
        try {
            const response = await fetch('/api/orders');
            const orders = await response.json();

            const container = document.getElementById('orders-container');
            container.innerHTML = '';

            if (orders.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#888;">No active orders in the queue right now.</p>';
                return;
            }

            orders.reverse().forEach(o => {
                const tipText = (o.tip_amount && o.tip_amount > 0) ? ` (includes $${o.tip_amount.toFixed(2)} tip)` : '';
                const card = document.createElement('div');
                card.className = 'order-card';
                card.innerHTML = `
                    <div class="order-info">
                        <h3>Pickup: ${o.merchant_name}</h3>
                        <p><strong>Total Paid:</strong> $${o.total_amount.toFixed(2)}</p>
                        <p><strong>Driver Payout:</strong> $${o.driver_payout.toFixed(2)}${tipText}</p>
                        <p><small style="color:#666;">Intent ID: ${o.payment_intent_id}</small></p>
                    </div>
                    <div class="right-section">
                        <span class="badge">${o.status}</span>
                        <button class="btn-delete" onclick="deleteOrder('${o.payment_intent_id}')">Clear Order</button>
                    </div>
                `;
                container.appendChild(card);
            });
        } catch (err) {
            console.error("Error fetching orders:", err);
        }
    }

    fetchOrders();
    setInterval(fetchOrders, 3000);
</script>

</body>
</html>
